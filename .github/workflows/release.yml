name: Release

# 推送 v* tag（如 v1.0.0）时触发：构建三个镜像（amd64 + arm64）推送到 GHCR，
# 并把 install.sh 附加到 GitHub Release。
#
# 镜像命名（与 deploy/docker-compose.yml、deploy/.env.example 的 IMAGE_PREFIX 保持一致）：
#   ghcr.io/<owner>/singbox-panel-control-plane:<tag>
#   ghcr.io/<owner>/singbox-panel-edge-agent:<tag>
#   ghcr.io/<owner>/singbox-panel-web:<tag>
# 其中 <owner> 自动取 github.repository_owner，无需手工替换。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # 上传 Release 资产（install.sh）
  packages: write      # 推送 GHCR 镜像

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  docker:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            dockerfile: deploy/docker/control-plane.Dockerfile
          - service: edge-agent
            dockerfile: deploy/docker/edge-agent.Dockerfile
          - service: web
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/singbox-panel-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release with install.sh
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/install.sh
          generate_release_notes: true
