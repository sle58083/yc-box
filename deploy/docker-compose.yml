# sing-box 企业级代理面板 —— 单机自包含部署
#
# 服务拓扑：
#   postgres(数据) / redis(会话缓存) / control-plane(控制面 8080，仅内网)
#   web(nginx，对外 80) / edge-agent(托管 sing-box，连控制面 WS，空配置等待下发)
#
# 使用：
#   - 一键部署：curl -sSL .../deploy/install.sh | bash   （install.sh 会生成 .env 并拉起）
#   - 源码构建：cd 仓库根目录 && docker compose -f deploy/docker-compose.yml up -d --build
#
# ⚠️ IMAGE_PREFIX 默认 ghcr.io/sle58083（已替换为 GitHub 用户名）。

name: ${COMPOSE_PROJECT_NAME:-singbox-panel}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-singbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-singbox_panel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  control-plane:
    # 预构建镜像（install.sh 会先 docker compose pull）；未发布时回退到本地 build
    image: ${IMAGE_PREFIX:-ghcr.io/sle58083}/singbox-panel-control-plane:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    environment:
      SBP_SERVER_HOST: "0.0.0.0"
      SBP_SERVER_PORT: "8080"
      SBP_SERVER_MODE: "release"
      SBP_DATABASE_HOST: "postgres"
      SBP_DATABASE_PORT: "5432"
      SBP_DATABASE_USER: ${DB_USER:-singbox}
      SBP_DATABASE_PASSWORD: ${DB_PASSWORD}
      SBP_DATABASE_NAME: ${DB_NAME:-singbox_panel}
      SBP_DATABASE_SSLMODE: "disable"
      SBP_DATABASE_TIMEZONE: "UTC"
      SBP_REDIS_ADDR: "redis:6379"
      SBP_JWT_SECRET: ${JWT_SECRET}
      SBP_CRYPTO_KEY: ${CRYPTO_KEY}
      SBP_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SBP_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SBP_LOG_LEVEL: ${LOG_LEVEL:-info}
      SBP_LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 控制面仅 compose 内网互通；如需宿主机直接调试可取消下面注释
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/sle58083}/singbox-panel-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      control-plane:
        condition: service_healthy

  edge-agent:
    image: ${IMAGE_PREFIX:-ghcr.io/sle58083}/singbox-panel-edge-agent:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/edge-agent.Dockerfile
    restart: unless-stopped
    environment:
      SBAGENT_AGENT_DATADIR: "/opt/singbox-agent"
      # 单机模式：经 compose 内网直连控制面 WebSocket
      SBAGENT_CONTROL_SERVER_URL: "ws://control-plane:8080/ws/agent"
      SBAGENT_CONTROL_TOKEN: ${AGENT_TOKEN}
      SBAGENT_LOG_LEVEL: ${LOG_LEVEL:-info}
      SBAGENT_LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - agent_data:/opt/singbox-agent
    # sing-box 入站端口映射：面板中配置的入站端口必须落在 NODE_PORT_RANGE 范围内。
    # TCP + UDP（hysteria2/tuic 等 UDP 协议需要 UDP 映射）。
    ports:
      - "${NODE_PORT_RANGE:-10000-10100}:${NODE_PORT_RANGE:-10000-10100}"
      - "${NODE_PORT_RANGE:-10000-10100}:${NODE_PORT_RANGE:-10000-10100}/udp"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  pg_data:
  agent_data:
