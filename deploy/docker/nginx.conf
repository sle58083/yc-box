# 前端容器内的 Nginx 配置：
#   1) 托管 Vite 构建产物（SPA）
#   2) 反代 /api/ 到控制面
#   3) 反代 /ws/ 到控制面（Agent WebSocket 长连接，Upgrade 头是关键）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 传输压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 前端 SPA：history 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 控制面 REST API（/api/v1/*）
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 控制面健康检查（透传 /healthz）
    location = /healthz {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
    }

    # Agent WebSocket 长连接（/ws/agent）
    # 关键：必须带 Upgrade/Connection 头，否则无法建立长连接
    location /ws/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接超时放宽 + 关闭缓冲，避免帧被延迟
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
