# sing-box 边缘 Agent 配置示例（复制为 agent.yaml 或通过环境变量 SBAGENT_* 覆盖）
agent:
  datadir: /opt/singbox-agent        # Windows: C:\ProgramData\singbox-agent
  # key_file: ""                     # 🔐 本地主密钥文件，默认 <datadir>/etc/agent.key
  kernel:
    os: auto                         # 默认 runtime.GOOS
    arch: auto                       # 默认 runtime.GOARCH
    version: ""                      # 空=跟随控制面下发
    download_url: ""                 # 控制面内核下载地址（或走 WS 下发）
  proc:
    stop_grace: 10s                  # Stop 优雅超时
    health_interval: 3s              # 健康探测间隔

control:
  server_url: "wss://panel.example.com/ws/agent"
  token: "change-me"                 # # 初始令牌，首次启动后建议改由 secret 管理
  retry_min: 1s                      # 断线重连最小退避
  retry_max: 30s                     # 断线重连最大退避
  heartbeat: 5s                      # 心跳间隔

log:
  level: info                        # debug / info / warn / error
  format: json                       # json / console
